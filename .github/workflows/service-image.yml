# Build the PR service image and publish it to ghcr.io/<owner>/verso-service.
#   push to main   → :main and :sha-<short>
#   tag v1.2.3     → :1.2.3, :1.2 and :latest
#   pull request   → built (both architectures) but not pushed
name: Service image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: [service/**, src/**, scripts/build.mjs, package.json, package-lock.json, Dockerfile, .dockerignore, .github/workflows/service-image.yml]
  pull_request:
    paths: [service/**, src/**, scripts/build.mjs, package.json, package-lock.json, Dockerfile, .dockerignore, .github/workflows/service-image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: service-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run -s typecheck
      - run: npm test

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/verso-service
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
